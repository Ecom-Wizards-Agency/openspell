name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / lint / test / hygiene
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The hygiene lint reads the tracked file list from git, so it needs a
          # real working tree (a shallow clone is fine, a sparse one is not).
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install deployment test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Verify Evo report-worker deployment
        run: bash docs/deploy/test-report-worker-evo-systemd.sh

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Apply and verify migrations
        run: pnpm --filter @wizard-ads/db exec vitest run src/migrations.test.ts --maxWorkers=1
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Test
        # Turbo serializes package tasks; arguments after `--` are forwarded to
        # each Vitest task so test files cannot contend for the one Postgres service.
        # UI keeps its own dedicated, single-worker performance-test invocation.
        run: |
          pnpm exec turbo run test --filter=!@wizard-ads/ui --concurrency=1 -- --maxWorkers=1
          pnpm --filter @wizard-ads/ui run test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          WIZARD_ADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Hygiene (public-repo gate)
        run: pnpm run hygiene

  kernel-proof:
    name: trusted hosted-migration kernel proof
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact trusted revision without a credential
        run: |
          git init workspace
          git -C workspace remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C workspace fetch --depth=1 origin "$GITHUB_SHA"
          git -C workspace checkout --detach FETCH_HEAD
          test "$(git -C workspace rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workspace/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: workspace

      - name: Verify hosted migration Linux runtime proof
        run: pnpm --filter @wizard-ads/hosted-migration-runtime-proof run test:kernel
        working-directory: workspace

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      WIZARD_ADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply and verify migrations
        run: pnpm --filter @wizard-ads/db exec vitest run src/migrations.test.ts --maxWorkers=1

      - name: Install Chromium
        run: pnpm --filter @wizard-ads/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm --filter @wizard-ads/web run build

      - name: Test e2e (serial)
        # e2e/run.ts executes eleven database-owning suites in order; every
        # Playwright config also pins workers to one. Large route sweeps and
        # stateful workflows get fresh processes, so Next dev releases retained
        # route graphs between bounded suites.
        run: pnpm --filter @wizard-ads/web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/node_modules/.cache/playwright/reports
          if-no-files-found: ignore
