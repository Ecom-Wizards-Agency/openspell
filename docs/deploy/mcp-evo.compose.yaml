name: wizard-ads-mcp

services:
  mcp:
    build:
      context: ../..
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    env_file:
      - ${WIZARD_ADS_MCP_ENV_FILE:?Set WIZARD_ADS_MCP_ENV_FILE to the protected runtime environment file}
    environment:
      WIZARD_ADS_MCP_HOST: 0.0.0.0
      WIZARD_ADS_MCP_PORT: "8787"
      WIZARD_ADS_MCP_REVISION: ${WIZARD_ADS_MCP_REVISION:?Set WIZARD_ADS_MCP_REVISION to the approved Git object id}
    expose:
      - "8787"
    networks:
      - edge

  cloudflared:
    image: ${WIZARD_ADS_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel-token
    depends_on:
      mcp:
        condition: service_healthy
    secrets:
      - tunnel-token
    networks:
      - edge

networks:
  edge:

secrets:
  tunnel-token:
    file: ${WIZARD_ADS_MCP_CLOUDFLARED_TOKEN_FILE:?Set WIZARD_ADS_MCP_CLOUDFLARED_TOKEN_FILE to the protected tunnel-token file}
